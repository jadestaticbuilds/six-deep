<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2231">
<title>Six Deep</title>
<style>
  :root{
    --tubew: min(calc((100vw - 72px) / 6), 78px);
    --ball: calc(var(--tubew) - 14px);
    --jade: #2fbf71;
    --ink: #eaf4f8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -80px, rgba(64,150,180,.25), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 118px, rgba(255,255,255,.028) 118px 122px),
      linear-gradient(180deg, #14313f 0%, #0d2231 60%, #0a1b27 100%);
    min-height:100vh;
    min-height:100dvh;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    background:rgba(10,27,39,.82);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:2px; font-size:15px; }
  .brand .dot{ width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #a7f3d0, var(--jade) 60%, #0e6b3c);
    box-shadow:0 0 8px rgba(47,191,113,.7); }
  .pill{
    font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12);
    white-space:nowrap;
  }
  .spacer{ flex:1; }
  .iconbtn{
    width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.08); color:var(--ink); font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn:active{ transform:scale(.93); background:rgba(255,255,255,.16); }
  .iconbtn.dim{ opacity:.35; }
  #board{ display:flex; flex-direction:column; gap:14px; align-items:center; padding:16px 8px 30px; margin:0 auto; max-width:720px; }
  .row{ display:flex; gap:8px; justify-content:center; }
  .tube{
    width:var(--tubew); height:calc(var(--ball) * 6 + 14px);
    border:3px solid rgba(255,255,255,.30); border-radius:8px 8px 22px 22px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    box-shadow:inset 3px 0 6px rgba(255,255,255,.08), inset -3px 0 6px rgba(0,0,0,.25);
    display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start;
    padding:7px 0; cursor:pointer; position:relative;
    transition:border-color .15s, box-shadow .15s;
  }
  .tube.sel{ border-color:var(--jade); box-shadow:0 0 14px rgba(47,191,113,.55), inset 3px 0 6px rgba(255,255,255,.08); }
  .tube.shake{ animation:shake .3s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .ball{
    width:var(--ball); height:var(--ball); flex:0 0 auto; margin-top:-2px;
    border-radius:50%; position:relative;
    box-shadow:inset -3px -5px 7px rgba(0,0,0,.28), inset 3px 5px 7px rgba(255,255,255,.30), 0 2px 3px rgba(0,0,0,.35);
    transition:transform .12s;
  }
  .tube.sel .ball:last-child{ transform:translateY(-9px); }
  .ball::before{
    content:''; position:absolute; top:16%; left:20%; width:26%; height:26%;
    border-radius:50%; background:rgba(255,255,255,.8); filter:blur(.5px);
  }
  .ball::after{ content:''; position:absolute; inset:0; border-radius:50%; }
  .c0{ background:radial-gradient(circle at 35% 30%, #ffc7dd, #f06292 55%, #ad1457); }
  .c1{ background:radial-gradient(circle at 35% 30%, #b3f5ff, #22d3ee 55%, #0e7490); }
  .c1::after{ background:conic-gradient(from 20deg, rgba(255,255,255,.55), transparent 32%, rgba(255,255,255,.55) 52%, transparent 78%, rgba(255,255,255,.55)); }
  .c2{ background:radial-gradient(circle at 35% 30%, #d9f99d, #a3e635 55%, #4d7c0f); }
  .c2::after{ background:conic-gradient(from 200deg, rgba(255,255,255,.5), transparent 35%, rgba(255,255,255,.5) 55%, transparent 80%, rgba(255,255,255,.5)); }
  .c3{ background:radial-gradient(circle at 35% 30%, #d9a066, #8a5a2b 55%, #4a2c12); }
  .c4{ background:radial-gradient(circle at 35% 30%, #fed7aa, #fb923c 55%, #c2410c); }
  .c4::after{ background:conic-gradient(from 110deg, rgba(255,255,255,.55), transparent 30%, rgba(255,255,255,.55) 50%, transparent 75%, rgba(255,255,255,.55)); }
  .c5{ background:radial-gradient(circle at 35% 30%, #d8b4fe, #a855f7 55%, #6b21a8); }
  .c5::after{ background:repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 5px, transparent 5px 11px); }
  .c6{ background:radial-gradient(circle at 35% 30%, #bfdbfe, #60a5fa 55%, #1e40af); }
  .c7{ background:radial-gradient(circle at 35% 30%, #bbf7d0, #4ade80 55%, #166534); }
  .c8{ background:radial-gradient(circle at 35% 30%, #fef9c3, #facc15 55%, #a16207); }
  .c9{ background:radial-gradient(circle at 35% 30%, #fecaca, #f87171 55%, #991b1b); }
  .ball.pop{ animation:pop .22s; }
  @keyframes pop{ 0%{transform:scale(.6)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
  footer{ text-align:center; font-size:11px; opacity:.55; padding:0 0 calc(26px + env(safe-area-inset-bottom)); letter-spacing:1px; }
  #overlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(6,16,24,.72); backdrop-filter:blur(6px);
  }
  #overlay.show{ display:flex; }
  .card{
    background:linear-gradient(180deg, #17394c, #10293a);
    border:1px solid rgba(255,255,255,.14); border-radius:20px;
    padding:28px 26px; max-width:340px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .card h2{ margin:0 0 10px; font-size:22px; letter-spacing:1px; }
  .card p{ margin:8px 0; font-size:14px; line-height:1.55; opacity:.92; }
  .card .big{ font-size:15px; font-weight:700; color:var(--jade); }
  .btn{
    margin-top:16px; width:100%; padding:14px; border:none; border-radius:14px;
    font-size:16px; font-weight:800; letter-spacing:1px; cursor:pointer;
    background:linear-gradient(180deg, #3ddc84, #1d9d55); color:#06281a;
    box-shadow:0 4px 14px rgba(47,191,113,.4);
  }
  .btn:active{ transform:scale(.97); }
  .btn.ghost{ background:rgba(255,255,255,.1); color:var(--ink); box-shadow:none; margin-top:10px; }
  .confetti{ position:fixed; top:-14px; width:10px; height:14px; z-index:60; border-radius:3px; animation:fall linear forwards; pointer-events:none; }
  @keyframes fall{ to{ transform:translateY(105vh) rotate(720deg); } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>SIX DEEP</div>
  <span class="pill" id="levelPill">Level 1</span>
  <span class="pill" id="movesPill">0 moves</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="undoBtn" title="Undo">&#8630;</button>
  <button class="iconbtn" id="restartBtn" title="Restart level">&#8635;</button>
  <button class="iconbtn" id="soundBtn" title="Sound">&#9836;</button>
  <button class="iconbtn" id="helpBtn" title="How to play">?</button>
</header>
<div id="board"></div>
<footer>A JADE STATIC BUILDS GAME</footer>
<div id="overlay"><div class="card" id="overlayCard"></div></div>
<script>
'use strict';
/* Six Deep - pure game logic (no DOM). Works in node and the browser. */

const CAP = 6;

function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Level ladder: 4 colors at L1-2, +1 every 2 levels, capped at 10 (L13+). */
function colorsForLevel(level) {
  return Math.min(10, 4 + Math.floor((level - 1) / 2));
}
function tubeCountFor(colors) { return colors + 2; }

/* Tubes are arrays; index 0 is the bottom, last element is the top. */

function topRun(tube) {
  const n = tube.length;
  if (!n) return null;
  const c = tube[n - 1];
  let k = 1;
  while (k < n && tube[n - 1 - k] === c) k++;
  return { color: c, count: k };
}

function isHomogeneous(tube) {
  for (let i = 1; i < tube.length; i++) if (tube[i] !== tube[0]) return false;
  return true;
}

function isCompleteTube(tube) {
  return tube.length === CAP && isHomogeneous(tube);
}

function isSolved(tubes) {
  for (const t of tubes) {
    if (t.length === 0) continue;
    if (t.length !== CAP || !isHomogeneous(t)) return false;
  }
  return true;
}

/* Balls that would pour from `from` to `to`; 0 means the pour is illegal. */
function pourCount(tubes, from, to) {
  if (from === to) return 0;
  const src = tubes[from], dst = tubes[to];
  if (!src.length || dst.length >= CAP) return 0;
  const run = topRun(src);
  if (dst.length === 0) return Math.min(run.count, CAP);
  if (dst[dst.length - 1] !== run.color) return 0;
  return Math.min(run.count, CAP - dst.length);
}

function doPour(tubes, from, to) {
  const n = pourCount(tubes, from, to);
  const src = tubes[from], dst = tubes[to];
  for (let i = 0; i < n; i++) dst.push(src.pop());
  return n;
}

function undoPour(tubes, from, to, n) {
  const src = tubes[from], dst = tubes[to];
  for (let i = 0; i < n; i++) src.push(dst.pop());
}

function stateKey(tubes) {
  return tubes.map(t => t.join('')).join('|');
}

/*
 * Depth-first solvability check with safe prunings and move ordering.
 * Returns { moves, nodes } when a solution is found within the caps,
 * otherwise null (unsolved within caps; the deal is NOT proven unsolvable).
 */
function solve(initialTubes, opts) {
  opts = opts || {};
  const timeCap = opts.timeCapMs || 1000;
  const nodeCap = opts.nodeCap || 150000;
  const tubes = initialTubes.map(t => t.slice());
  const n = tubes.length;
  const start = Date.now();
  const seen = new Set();
  const path = [];
  let nodes = 0;
  let timedOut = false;

  function orderedMoves() {
    const moves = [];
    for (let i = 0; i < n; i++) {
      const src = tubes[i];
      if (!src.length || isCompleteTube(src)) continue;
      const run = topRun(src);
      const srcHomog = isHomogeneous(src);
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const dst = tubes[j];
        if (dst.length >= CAP) continue;
        if (dst.length === 0) {
          if (srcHomog) continue; /* relocating a uniform stack is a no-op */
          moves.push({ from: i, to: j, pri: 2 });
        } else if (dst[dst.length - 1] === run.color) {
          const completes = dst.length + Math.min(run.count, CAP - dst.length) === CAP;
          moves.push({ from: i, to: j, pri: completes ? 0 : 1 });
        }
      }
    }
    moves.sort((a, b) => a.pri - b.pri);
    return moves;
  }

  function dfs(depth) {
    if (isSolved(tubes)) return true;
    if (depth > 400 || timedOut) return false;
    if ((nodes & 1023) === 0 && Date.now() - start > timeCap) { timedOut = true; return false; }
    if (nodes++ > nodeCap) { timedOut = true; return false; }
    const moves = orderedMoves();
    for (const m of moves) {
      const c = doPour(tubes, m.from, m.to);
      const key = stateKey(tubes);
      if (!seen.has(key)) {
        seen.add(key);
        path.push({ from: m.from, to: m.to, count: c });
        if (dfs(depth + 1)) return true;
        path.pop();
      }
      undoPour(tubes, m.from, m.to, c);
      if (timedOut) return false;
    }
    return false;
  }

  seen.add(stateKey(tubes));
  const ok = dfs(0);
  return ok ? { moves: path.slice(), nodes } : null;
}

function randomDeal(level, attempt) {
  const colors = colorsForLevel(level);
  const tubesN = tubeCountFor(colors);
  const rng = mulberry32(xmur3('sixdeep|' + level + '|' + attempt));
  const balls = [];
  for (let c = 0; c < colors; c++) for (let k = 0; k < CAP; k++) balls.push(c);
  for (let i = balls.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = balls[i]; balls[i] = balls[j]; balls[j] = tmp;
  }
  const tubes = [];
  for (let t = 0; t < tubesN; t++) tubes.push([]);
  let bi = 0;
  for (let t = 0; t < colors; t++) for (let k = 0; k < CAP; k++) tubes[t].push(balls[bi++]);
  return { tubes, colors, tubesN };
}

/* Deterministic per level: same level always deals the same verified board. */
/* Target solution lengths for smooth difficulty ramp (Nov 3, 2026) */
const TARGET_MOVES = {1:15, 2:20, 3:25, 4:30, 5:35, 6:40, 7:45, 8:50, 9:55, 10:60, 11:65, 12:70, 13:75, 14:80, 15:85, 16:90};

function genLevel(level, opts) {
  opts = opts || {};
  const target = opts.targetMoves || TARGET_MOVES[level] || 12;
  const tolerance = 8; // accept within ±8 of target
  let best = null, bestDiff = Infinity;
  for (let attempt = 0; attempt < 300; attempt++) {
    const d = randomDeal(level, attempt);
    if (isSolved(d.tubes)) continue;
    const sol = solve(d.tubes, { timeCapMs: 1000, nodeCap: 150000 });
    if (sol) {
      const diff = Math.abs(sol.moves.length - target);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = {
          tubes: d.tubes, colors: d.colors, tubesN: d.tubesN,
          solutionLen: sol.moves.length, attempt, nodes: sol.nodes
        };
        if (diff <= tolerance) break; // good enough
      }
    }
  }
  if (!best) throw new Error('could not generate a verified deal for level ' + level);
  return best;
}

function cloneTubes(tubes) { return tubes.map(t => t.slice()); }

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    CAP, xmur3, mulberry32, colorsForLevel, tubeCountFor,
    topRun, isHomogeneous, isCompleteTube, isSolved,
    pourCount, doPour, undoPour, stateKey, solve,
    randomDeal, genLevel, cloneTubes
  };
}
</script>
<script>
/* Six Deep - UI layer. Core logic (genLevel, pourCount, doPour, undoPour,
   isSolved, cloneTubes, colorsForLevel) is defined in core.js above. */
(function () {
  'use strict';
  var SAVE_KEY = 'sixdeep.v1';
  var S = null;
  var selected = null;
  var popped = null; /* {tube, key} of the ball to pop-animate after render */

  var board = document.getElementById('board');
  var levelPill = document.getElementById('levelPill');
  var movesPill = document.getElementById('movesPill');
  var undoBtn = document.getElementById('undoBtn');
  var restartBtn = document.getElementById('restartBtn');
  var soundBtn = document.getElementById('soundBtn');
  var helpBtn = document.getElementById('helpBtn');
  var overlay = document.getElementById('overlay');
  var overlayCard = document.getElementById('overlayCard');

  function freshState() {
    return {
      level: 1, tubes: [], initial: [], moves: 0, history: [],
      stats: { completed: 0, best: {} }, muted: false, seenHelp: false
    };
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (s && s.tubes && s.tubes.length && s.initial && s.initial.length) return s;
    } catch (e) {}
    return null;
  }

  /* ---------- audio (tiny synth, no assets) ---------- */
  var AC = null;
  function tone(freq, dur, type, gain, when) {
    if (S.muted) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = AC.currentTime + (when || 0);
      var o = AC.createOscillator(), v = AC.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      v.gain.setValueAtTime(gain || 0.07, t0);
      v.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(v); v.connect(AC.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function sfxSelect() { tone(520, 0.07); }
  function sfxPour() { tone(300, 0.09); tone(470, 0.1, 'sine', 0.06, 0.06); }
  function sfxBad() { tone(140, 0.15, 'sawtooth', 0.04); }
  function sfxWin() {
    var seq = [523, 659, 784, 1047];
    for (var i = 0; i < seq.length; i++) tone(seq[i], 0.2, 'triangle', 0.08, i * 0.1);
  }

  /* ---------- rendering ---------- */
  function tubeEl(i, tube) {
    var d = document.createElement('div');
    d.className = 'tube' + (i === selected ? ' sel' : '');
    d.setAttribute('data-i', i);
    for (var bi = 0; bi < tube.length; bi++) {
      var b = document.createElement('div');
      b.className = 'ball c' + tube[bi];
      if (popped && popped.tube === i && bi === tube.length - 1) b.className += ' pop';
      d.appendChild(b);
    }
    (function (idx, el) {
      el.addEventListener('click', function () { tapTube(idx); });
    })(i, d);
    return d;
  }

  function render() {
    levelPill.textContent = 'Level ' + S.level;
    movesPill.textContent = S.moves + (S.moves === 1 ? ' move' : ' moves');
    undoBtn.classList.toggle('dim', !S.history.length);
    soundBtn.style.opacity = S.muted ? 0.35 : 1;
    board.innerHTML = '';
    var perRow = 6, r, idx, rowEl;
    for (r = 0; r < S.tubes.length; r += perRow) {
      rowEl = document.createElement('div');
      rowEl.className = 'row';
      for (idx = r; idx < Math.min(r + perRow, S.tubes.length); idx++) {
        rowEl.appendChild(tubeEl(idx, S.tubes[idx]));
      }
      board.appendChild(rowEl);
    }
    popped = null;
  }

  function shakeTube(i) {
    var el = board.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  /* ---------- game flow ---------- */
  function startLevel(level) {
    var g = genLevel(level);
    S.level = level;
    S.tubes = cloneTubes(g.tubes);
    S.initial = cloneTubes(g.tubes);
    S.moves = 0;
    S.history = [];
    selected = null;
    save();
    render();
  }

  function tapTube(i) {
    if (overlay.classList.contains('show')) return;
    if (selected === null) {
      if (S.tubes[i].length) { selected = i; sfxSelect(); render(); }
      return;
    }
    if (selected === i) { selected = null; render(); return; }
    var from = selected;
    var n = pourCount(S.tubes, from, i);
    if (n > 0) {
      doPour(S.tubes, from, i);
      S.history.push({ from: from, to: i, count: n });
      S.moves++;
      selected = null;
      popped = { tube: i };
      sfxPour();
      save();
      render();
      if (isSolved(S.tubes)) onWin();
    } else {
      sfxBad();
      shakeTube(i);
      selected = S.tubes[i].length ? i : null;
      render();
    }
  }

  function undo() {
    var h = S.history.pop();
    if (!h) return;
    undoPour(S.tubes, h.from, h.to, h.count);
    S.moves = Math.max(0, S.moves - 1);
    selected = null;
    sfxSelect();
    save();
    render();
  }

  function restart() {
    S.tubes = cloneTubes(S.initial);
    S.moves = 0;
    S.history = [];
    selected = null;
    sfxSelect();
    save();
    render();
  }

  function confetti() {
    var colors = ['#f06292', '#22d3ee', '#a3e635', '#fb923c', '#a855f7', '#facc15', '#f87171', '#2fbf71'];
    for (var i = 0; i < 34; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 4000); })(c);
    }
  }

  function onWin() {
    sfxWin();
    confetti();
    S.stats.completed++;
    var best = S.stats.best[S.level];
    if (!best || S.moves < best) S.stats.best[S.level] = S.moves;
    save();
    var colors = colorsForLevel(S.level);
    var nextColors = colorsForLevel(S.level + 1);
    var note = nextColors > colors
      ? 'Next up: ' + nextColors + ' colors.'
      : 'Still ' + nextColors + ' colors. Deeper in.';
    overlayCard.innerHTML =
      '<h2>Level ' + S.level + ' complete</h2>' +
      '<p class="big">' + S.moves + (S.moves === 1 ? ' move' : ' moves') + '</p>' +
      '<p>' + note + '</p>' +
      '<button class="btn" id="nextBtn">NEXT LEVEL</button>';
    overlay.classList.add('show');
    document.getElementById('nextBtn').addEventListener('click', function () {
      overlay.classList.remove('show');
      startLevel(S.level + 1);
      window.scrollTo(0, 0);
    });
  }

  function showHelp() {
    overlayCard.innerHTML =
      '<h2>How to play</h2>' +
      '<p>Sort every candy so each tube holds one color.</p>' +
      '<p>Tap a tube to lift the top candy, then tap another tube to pour. You can only pour onto matching candy or into an empty tube. Tubes hold 6.</p>' +
      '<p>New colors join as you climb levels. Every board is guaranteed solvable.</p>' +
      '<button class="btn" id="gotItBtn">GOT IT</button>';
    overlay.classList.add('show');
    document.getElementById('gotItBtn').addEventListener('click', function () {
      overlay.classList.remove('show');
      S.seenHelp = true;
      save();
    });
  }

  /* ---------- wire up ---------- */
  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', restart);
  soundBtn.addEventListener('click', function () {
    S.muted = !S.muted;
    save();
    render();
    if (!S.muted) sfxSelect();
  });
  helpBtn.addEventListener('click', showHelp);

  /* ---------- boot ---------- */
  S = load() || freshState();
  if (!S.tubes.length) {
    startLevel(S.level || 1);
  } else {
    selected = null;
    render();
  }
  if (!S.seenHelp) showHelp();
})();
</script>
</body>
</html>
